name: Backend CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring-boot:
    name: spring-boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Build package
        run: mvn -B package -DskipTests

  fastapi:
    name: fastapi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            fastapi-service/requirements.txt
            fastapi-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app tests

      - name: Run tests
        run: python -m pytest

      - name: Build check
        run: python -m compileall app tests
