spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: spring-service
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:smart_city}
    username: ${POSTGRES_USER:smart_city_user}
    password: ${POSTGRES_PASSWORD:smart_city_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: core
        format_sql: true
  flyway:
    enabled: true
    default-schema: core
    schemas: core
    create-schemas: true

server:
  port: ${SPRING_SERVICE_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5000}
  auth:
    clerk:
      issuer-url: ${CLERK_ISSUER_URL:}
      jwks-url: ${CLERK_JWKS_URL:}
      audience: ${CLERK_AUDIENCE:}
