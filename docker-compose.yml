services:
  postgres:
    image: postgres:15-alpine
    container_name: smart-city-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_city}
      POSTGRES_USER: ${POSTGRES_USER:-smart_city_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_city_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-smart_city_user} -d ${POSTGRES_DB:-smart_city}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
